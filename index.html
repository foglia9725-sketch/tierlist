  DISCORD_URL:    'https://discord.gg/7YkVxH7PKT',

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d1117;--bg2:#151c27;--bg3:#1c2535;--bg4:#243040;
  --gold:#c8a84b;--gold2:#e2c46a;--gold3:#8a6e28;--gold-dim:#3a2e10;
  --green-btn:#1a3828;--green-btn2:#2a5438;
  --text:#e8dfc8;--text2:#8a9ab0;--text3:#506070;
  --border:#2a3a50;--border-gold:rgba(200,168,75,.35);--border-gold2:rgba(200,168,75,.6);
  --red:#c0392b;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);}
body{font-family:'Microsoft JhengHei','PingFang TC','Segoe UI',sans-serif;font-size:14px;}
.wrap{max-width:720px;margin:0 auto;padding-bottom:40px;}

/* Header */
.header{background:var(--bg2);border-bottom:1.5px solid var(--border-gold);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:100;}
.logo{color:var(--gold2);font-size:15px;font-weight:700;letter-spacing:2px;white-space:nowrap;}
.hbtn{padding:5px 14px;border-radius:4px;border:1px solid var(--border-gold);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:12px;white-space:nowrap;}
.hbtn:hover{border-color:var(--gold);color:var(--gold);}

.main{padding:12px 14px;}

/* 遊戲頁籤 */
.game-tab-bar{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px;overflow:hidden;}
.game-tab-label{font-size:12px;color:var(--text3);white-space:nowrap;flex-shrink:0;}
.game-tabs-scroll{display:flex;gap:6px;overflow-x:auto;flex:1;padding-bottom:2px;}
.game-tabs-scroll::-webkit-scrollbar{height:3px;}
.game-tabs-scroll::-webkit-scrollbar-thumb{background:var(--gold3);border-radius:2px;}
.gtab{flex-shrink:0;padding:5px 16px;border-radius:4px;border:1px solid var(--border-gold);background:transparent;color:var(--text2);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;}
.gtab.active{background:var(--gold);border-color:var(--gold);color:#0d1117;}
.gtab:hover:not(.active){border-color:var(--gold2);color:var(--gold2);}

/* 等級設置 */
.mode-bar{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.mode-label{font-size:13px;color:var(--gold);font-weight:600;}
.mode-select{background:var(--bg3);border:1px solid var(--border-gold);color:var(--text);padding:5px 10px;border-radius:4px;font-size:13px;cursor:pointer;}

/* 無遊戲提示 */
.no-game-hint{background:var(--bg2);border:1px dashed var(--border-gold);border-radius:6px;padding:36px 16px;text-align:center;color:var(--text3);font-size:13px;margin-bottom:8px;}
.no-game-hint .hint-icon{font-size:28px;margin-bottom:8px;}

/* 角色池 */
.pool-section{background:var(--bg2);border:1.5px solid var(--border-gold2);border-radius:6px;padding:10px;margin-bottom:8px;}
.pool-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.pool-title{font-size:12px;color:var(--text2);}
.reset-btn{padding:5px 16px;border-radius:4px;border:1.5px solid var(--gold);background:var(--gold-dim);color:var(--gold2);cursor:pointer;font-size:12px;font-weight:700;}
.reset-btn:hover{background:var(--gold);color:#0d1117;}
.pool-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;min-height:90px;align-items:center;}
.pool-scroll::-webkit-scrollbar{height:4px;}
.pool-scroll::-webkit-scrollbar-thumb{background:var(--gold3);border-radius:2px;}

/* 角色卡片 */
.char-card{flex-shrink:0;width:72px;cursor:pointer;border-radius:6px;overflow:hidden;border:1.5px solid var(--border);background:var(--bg3);position:relative;user-select:none;transition:border-color .15s,transform .15s;}
.char-card:hover{border-color:var(--gold);transform:scale(1.05);}
.char-card.selected{border-color:var(--gold2);outline:2px solid var(--gold2);}
.char-card.dragging{opacity:.3;}
.char-card img{width:72px;height:72px;object-fit:cover;display:block;}
.char-ph{width:72px;height:72px;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--bg4);}
.char-name{font-size:10px;text-align:center;padding:2px 3px 3px;background:rgba(13,17,23,.85);color:var(--gold2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Tier 行 */
.tiers{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.tier-row{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--border);min-height:84px;}
.tier-label{width:58px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;}
.tier-drop{flex:1;display:flex;flex-wrap:wrap;gap:4px;padding:6px;align-content:flex-start;min-height:84px;background:var(--bg2);transition:background .15s;}
.tier-drop.drag-over{background:rgba(200,168,75,.08);outline:1.5px dashed var(--gold);outline-offset:-2px;}

/* 水印 */
.wm-wrap{position:relative;}
.wm-overlay{position:absolute;inset:0;pointer-events:none;z-index:20;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.wm-text{font-size:72px;font-weight:900;color:rgba(200,168,75,.13);white-space:nowrap;transform:rotate(-30deg);letter-spacing:6px;user-select:none;}

/* 分享按鈕 */
.share-section{display:flex;flex-direction:column;gap:7px;margin-bottom:10px;}
.btn-screenshot{width:100%;padding:13px;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;text-align:center;border:2px solid var(--gold);background:var(--gold);color:#0d1117;}
.btn-screenshot:hover{background:var(--gold2);}
.share-row2{display:flex;gap:7px;}
.btn-share-tool{flex:1;padding:12px 8px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;text-align:center;border:2px solid #4a5a70;background:#243040;color:#e8dfc8;}
.btn-share-tool:hover{border-color:var(--gold);color:var(--gold);}
.btn-community{flex:1;padding:12px 8px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;text-align:center;border:2px solid #3a6e4a;background:#1a3828;color:#7ecfa0;position:relative;overflow:visible;}
.btn-community:hover{background:var(--green-btn2);}
.pulse-ring{position:absolute;inset:-5px;border-radius:10px;border:2px solid #3a7a52;animation:ring 2s infinite;pointer-events:none;}
@keyframes ring{0%{opacity:.7;transform:scale(1);}100%{opacity:0;transform:scale(1.1);}}

/* 分享文案彈窗 */
.share-popup{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border-gold2);border-radius:12px;padding:14px 16px;z-index:900;width:min(90vw,380px);line-height:1.7;}
.share-popup.show{display:block;}
.share-popup-text{color:var(--text2);font-size:13px;margin-bottom:10px;white-space:pre-line;}
.share-popup-close{position:absolute;top:8px;right:12px;cursor:pointer;color:var(--text3);font-size:18px;}
.share-popup-copy{width:100%;padding:8px;border-radius:6px;background:var(--gold);border:none;color:#0d1117;font-weight:700;font-size:13px;cursor:pointer;}

/* 右鍵選單 */
.ctx-menu{position:fixed;z-index:600;background:var(--bg2);border:1.5px solid var(--border-gold2);border-radius:8px;padding:5px;min-width:104px;display:none;}
.ctx-menu.show{display:block;}
.ctx-item{padding:7px 12px;border-radius:5px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;}
.ctx-item:hover{background:var(--bg4);color:var(--gold2);}
.ctx-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.ctx-divider{height:1px;background:var(--border);margin:3px 4px;}
.ctx-back{color:var(--text2);font-size:12px;}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#0d1117;padding:8px 22px;border-radius:20px;font-size:13px;font-weight:700;display:none;z-index:1200;white-space:nowrap;}

/* Loading */
.loading-bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--gold);transform-origin:left;animation:loading 1s ease-in-out infinite alternate;display:none;z-index:2000;}
.loading-bar.show{display:block;}
@keyframes loading{from{transform:scaleX(.1);}to{transform:scaleX(.9);}}

/* 截圖模式 */
.edit-view.hide{display:none;}
.snap-view{display:none;padding:0 14px 24px;}
.snap-view.show{display:block;}
.snap-header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 14px;border-bottom:1px solid var(--border-gold);margin-bottom:12px;}
.snap-title{font-size:14px;color:var(--gold2);font-weight:700;}
.snap-header-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.snap-discord-txt{font-size:11px;color:var(--text2);line-height:1.6;text-align:right;}
.snap-qr{width:50px;height:50px;border-radius:4px;border:1px solid var(--border-gold);flex-shrink:0;}
.snap-tier-row{display:flex;align-items:flex-start;margin-bottom:4px;border-radius:5px;overflow:hidden;}
.snap-tier-label{width:58px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;min-height:84px;}
.snap-tier-chars{flex:1;display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:var(--bg2);min-height:84px;}
.snap-char{width:58px;border-radius:4px;overflow:hidden;border:1px solid var(--border-gold);}
.snap-char img{width:58px;height:58px;object-fit:cover;display:block;}
.snap-char-ph{width:58px;height:58px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--bg3);}
.snap-char-name{font-size:9px;text-align:center;padding:1px 2px;background:rgba(13,17,23,.9);color:var(--gold);font-weight:600;}
.snap-empty{color:var(--text3);font-size:11px;padding:6px;}
.snap-back-btn{width:100%;margin-top:12px;padding:12px;border-radius:6px;border:2px solid var(--gold);background:var(--gold-dim);color:#fff;font-size:14px;font-weight:700;cursor:pointer;text-align:center;}
.snap-back-btn:hover{background:var(--gold);color:#0d1117;}

/* ══ 管理面板 Modal ══ */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(5,8,14,.85);z-index:400;align-items:flex-start;justify-content:center;padding:16px 12px;overflow-y:auto;}
.modal-bg.show{display:flex;}
.modal{background:var(--bg2);border:1.5px solid var(--border-gold2);border-radius:12px;width:100%;max-width:500px;}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 0;}
.modal-title{font-size:15px;font-weight:700;color:var(--gold2);}
.modal-close{cursor:pointer;color:var(--text3);font-size:20px;line-height:1;}
.modal-close:hover{color:var(--gold);}

/* 管理面板內頁籤 */
.admin-tabs{display:flex;border-bottom:1px solid var(--border);margin:12px 0 0;padding:0 20px;}
.admin-tab{padding:8px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.admin-tab.active{color:var(--gold2);border-bottom-color:var(--gold);}
.admin-tab:hover:not(.active){color:var(--text2);}

/* 面板內容區 */
.admin-pane{display:none;padding:16px 20px 20px;}
.admin-pane.show{display:block;}

/* 鎖定畫面 */
.admin-lock-wrap{padding:20px;}
.pass-row{display:flex;gap:6px;}
.pass-row input{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:5px;font-size:13px;}
.pass-row button{padding:8px 16px;border-radius:5px;background:var(--gold);border:none;color:#0d1117;font-weight:700;cursor:pointer;}

/* 通用表單 */
.modal label{display:block;font-size:11px;color:var(--text2);font-weight:600;margin-top:12px;margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase;}
.modal input,.modal select{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:5px;font-size:13px;}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--gold);}

.section-title{font-size:11px;font-weight:700;color:var(--gold);margin:16px 0 6px;padding-top:14px;border-top:1px solid var(--border);letter-spacing:1px;text-transform:uppercase;}
.section-title:first-child{margin-top:0;padding-top:0;border-top:none;}

.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin-top:6px;}
.char-manage{position:relative;}
.char-manage .del{position:absolute;top:2px;right:2px;width:20px;height:20px;background:rgba(180,40,40,.9);border-radius:50%;border:none;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.tag{padding:4px 12px;border-radius:4px;border:1px solid var(--border-gold);background:var(--bg3);color:var(--text2);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;}
.tag .del-tag{cursor:pointer;color:var(--gold);font-size:14px;line-height:1;}
.add-row{display:flex;gap:6px;margin-top:6px;}
.add-row input{flex:1;}
.add-row button{padding:8px 14px;border-radius:5px;background:var(--gold);border:none;color:#0d1117;font-weight:700;cursor:pointer;}
.batch-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;margin-top:10px;}
.batch-item{border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--bg3);}
.batch-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
.batch-item input{width:100%;border:none;border-top:1px solid var(--border);background:var(--bg4);color:var(--gold2);font-size:11px;padding:4px 5px;text-align:center;}
.batch-confirm-btn{width:100%;margin-top:10px;padding:9px;border-radius:5px;border:none;background:#2d7a45;color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:none;}
.sync-status{font-size:11px;margin:4px 0;text-align:center;}
.sync-status.ok{color:#5cb85c;}
.sync-status.err{color:var(--red);}

/* ── 數據 tab ── */
.stat-filter{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.stat-btn{padding:5px 12px;border-radius:4px;border:1px solid var(--border-gold);background:transparent;color:var(--text2);cursor:pointer;font-size:12px;font-weight:600;}
.stat-btn.active{background:var(--gold);border-color:var(--gold);color:#0d1117;}
.stat-date{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:4px;font-size:12px;}
.stat-apply{padding:5px 12px;border-radius:4px;background:var(--gold);border:none;color:#0d1117;font-weight:700;font-size:12px;cursor:pointer;}
.stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-card{background:var(--bg3);border:1px solid var(--border-gold);border-radius:8px;padding:14px;text-align:center;}
.stat-card .sc-label{font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.stat-card .sc-val{font-size:34px;font-weight:700;color:var(--gold2);line-height:1;}
.stat-card .sc-sub{font-size:11px;color:var(--text2);margin-top:5px;}
/* 折線圖容器 */
.chart-wrap{background:var(--bg3);border:1px solid var(--border-gold);border-radius:8px;padding:14px;}
.chart-title{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
canvas#pvChart{width:100%!important;height:160px!important;}

/* ── Log tab ── */
.log-filter{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.log-table{width:100%;border-collapse:collapse;font-size:12px;}
.log-table th{color:var(--text3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;letter-spacing:.5px;font-size:11px;}
.log-table td{padding:7px 8px;border-bottom:1px solid rgba(42,58,80,.5);color:var(--text2);vertical-align:top;}
.log-table td:first-child{color:var(--text3);white-space:nowrap;font-size:11px;}
.log-table td:nth-child(2){color:var(--gold);font-weight:600;}
.log-tag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:700;}
.log-tag.add{background:rgba(45,122,69,.4);color:#7ecfa0;}
.log-tag.del{background:rgba(192,57,43,.4);color:#e88;}
.log-pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px;}
.log-pagination button{padding:4px 12px;border-radius:4px;border:1px solid var(--border-gold);background:transparent;color:var(--text2);cursor:pointer;font-size:12px;}
.log-pagination button:hover{border-color:var(--gold);color:var(--gold);}
.log-pagination button:disabled{opacity:.3;cursor:default;}
.log-page-info{font-size:12px;color:var(--text3);}

/* 暱稱彈窗 */
.nickname-modal{display:none;position:fixed;inset:0;background:rgba(5,8,14,.9);z-index:800;align-items:center;justify-content:center;}
.nickname-modal.show{display:flex;}
.nickname-box{background:var(--bg2);border:1.5px solid var(--border-gold2);border-radius:12px;padding:24px;width:min(90vw,340px);text-align:center;}
.nickname-box h3{color:var(--gold2);font-size:15px;font-weight:700;margin-bottom:8px;}
.nickname-box p{color:var(--text2);font-size:12px;margin-bottom:16px;line-height:1.6;}
.nickname-box input{width:100%;background:var(--bg3);border:1px solid var(--border-gold);color:var(--text);padding:9px 12px;border-radius:6px;font-size:14px;margin-bottom:12px;text-align:center;}
.nickname-box button{width:100%;padding:10px;border-radius:6px;background:var(--gold);border:none;color:#0d1117;font-size:14px;font-weight:700;cursor:pointer;}

.footer{text-align:center;padding:18px 16px 24px;font-size:11px;color:var(--text3);border-top:1px solid var(--border);margin-top:10px;}
</style>
</head>
<body>
<div class="loading-bar" id="loadingBar"></div>

<div class="wrap">
  <div class="edit-view" id="editView">
    <div class="header">
      <div class="logo" id="headerLogo">TIER LIST</div>
      <button class="hbtn" onclick="openAdmin()">⚙ 管理</button>
    </div>
    <div class="main">
      <div class="game-tab-bar">
        <span class="game-tab-label">遊戲選擇</span>
        <div class="game-tabs-scroll" id="gameTabs"></div>
      </div>
      <div class="mode-bar">
        <span class="mode-label">等級設置</span>
        <select class="mode-select" id="modeSelect" onchange="switchMode()"></select>
      </div>
      <div id="noGameHint" class="no-game-hint">
        <div class="hint-icon">⚔</div>請先選擇上方的遊戲頁籤
      </div>
      <div id="poolAndTiers" style="display:none;">
        <div class="pool-section">
          <div class="pool-header">
            <span class="pool-title">點擊或拖動圖片進行排名</span>
            <button class="reset-btn" onclick="resetAll()">重置</button>
          </div>
          <div class="pool-scroll" id="charPool"></div>
        </div>
        <div class="wm-wrap">
          <div class="tiers" id="tierRows"></div>
          <div class="wm-overlay"><span class="wm-text">出走玩家聯盟</span></div>
        </div>
      </div>
      <div class="share-section">
        <button class="btn-screenshot" onclick="showSnap()">隱藏 UI 截圖分享</button>
        <div class="share-row2">
          <button class="btn-share-tool" onclick="showSharePopup()">分享排行工具</button>
          <button class="btn-community" onclick="window.open(CONFIG.DISCORD_URL,'_blank')">
            <span class="pulse-ring"></span>加入社群提建議
          </button>
        </div>
      </div>
    </div>

<script>
/* ── MODES ── */
const MODES={
  '從夯到拉':{tiers:['夯','頂級','人上人','NPC','拉完了'],colors:['#27ae60','#2980b9','#8e44ad','#e67e22','#c0392b']},
  '級別排行':{tiers:['S','A','B','C','D'],colors:['#c0392b','#e67e22','#f1c40f','#27ae60','#2980b9']},
  '梯度排行':{tiers:['T0','T1','T2','T3','T4'],colors:['#c0392b','#e67e22','#f6d13b','#27ae60','#2980b9']},
};
const ADMIN_KEY='tl_admin_ok', NICK_KEY='tl_admin_nick', VID_KEY='tl_visitor_id';

/* ── STATE ── */
let sb=null,games=[],currentGame=null,currentMode='從夯到拉';
let state={},originalOrder={};
let dragCard=null,dragFrom=null,dragTier=null,activeCard=null;
let adminUnlocked=localStorage.getItem(ADMIN_KEY)==='1';
let adminNick=localStorage.getItem(NICK_KEY)||'';
let logPage=1,logTotal=0;
const LOG_PER_PAGE=10;
let pvChartInst=null;

/* ── VISITOR ── */
function getVid(){let v=localStorage.getItem(VID_KEY);if(!v){v='v_'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(VID_KEY,v);}return v;}
async function recordPV(){if(!sb)return;try{await sb.from('page_views').insert({visitor_id:getVid()});}catch(_){}}

/* ── SUPABASE ── */
async function initSupabase(){
  try{sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);await loadGames();recordPV();}
  catch(e){console.warn(e);loadDemoData();}
}
async function loadGames(){
  showLoading(true);
  try{
    const{data:rows,error}=await sb.from('games').select('*').order('created_at');
    if(error)throw error;
    games=rows.map(r=>r.name);
    for(const g of games){
      initState(g);
      const{data:chars,error:ce}=await sb.from('characters').select('*').eq('game',g).order('sort_order');
      if(ce)throw ce;
      const list=chars.map(r=>({id:r.id,name:r.name,img:r.img_url}));
      state[g].pool=[...list];originalOrder[g]=[...list];
    }
    setSyncStatus('已同步',true);
  }catch(e){setSyncStatus('連線失敗，本地模式',false);loadDemoData();}
  renderTabs();showLoading(false);
}
function loadDemoData(){games=['示範遊戲'];initState('示範遊戲');renderTabs();}
function initState(g){
  state[g]={pool:[],tiers:{}};
  Object.keys(MODES).forEach(m=>{state[g].tiers[m]={};MODES[m].tiers.forEach(t=>state[g].tiers[m][t]=[]);});
  originalOrder[g]=[];
}
function getAllChars(g){
  const seen=new Set(),all=[];
  (state[g]?.pool||[]).forEach(c=>{if(!seen.has(c.id)){seen.add(c.id);all.push(c);}});
  Object.keys(MODES).forEach(m=>MODES[m].tiers.forEach(t=>((state[g]?.tiers[m]||{})[t]||[]).forEach(c=>{if(!seen.has(c.id)){seen.add(c.id);all.push(c);}})));
  return all;
}

/* ── RENDER MAIN ── */
function updateLogo(){document.getElementById('headerLogo').textContent=currentGame?('⚔ '+currentGame):'TIER LIST';}
function renderTabs(){
  document.getElementById('gameTabs').innerHTML=games.map(g=>
    `<button class="gtab ${g===currentGame?'active':''}" onclick="switchGame('${g}')">${g}</button>`
  ).join('');
}
function renderModeSelect(){
  document.getElementById('modeSelect').innerHTML=Object.keys(MODES).map(m=>
    `<option value="${m}" ${m===currentMode?'selected':''}>${m}</option>`
  ).join('');
}
function switchGame(g){
  currentGame=g;updateLogo();renderTabs();
  document.getElementById('noGameHint').style.display='none';
  document.getElementById('poolAndTiers').style.display='block';
  renderPool();renderTiers();
}
function switchMode(){
  const nm=document.getElementById('modeSelect').value;
  if(nm===currentMode)return;
  if(currentGame){state[currentGame].pool=[...(originalOrder[currentGame]||[])];Object.keys(MODES).forEach(m=>MODES[m].tiers.forEach(t=>state[currentGame].tiers[m][t]=[])); }
  currentMode=nm;if(currentGame){renderPool();renderTiers();}
}
function resetAll(){
  if(!currentGame)return;
  state[currentGame].pool=[...(originalOrder[currentGame]||[])];
  Object.keys(MODES).forEach(m=>MODES[m].tiers.forEach(t=>state[currentGame].tiers[m][t]=[]));
  renderPool();renderTiers();showToast('已重置！');
}
function renderPool(){
  if(!currentGame)return;
  const el=document.getElementById('charPool'),chars=state[currentGame].pool;
  el.innerHTML='';
  if(!chars.length){el.innerHTML='<div style="color:var(--text3);font-size:12px;padding:14px;">尚無角色，請管理員上傳</div>';return;}
  chars.forEach(c=>el.appendChild(makeCard(c,'pool',null)));
}
function renderTiers(){
  if(!currentGame)return;
  const con=document.getElementById('tierRows');con.innerHTML='';
  MODES[currentMode].tiers.forEach((t,i)=>{
    const row=document.createElement('div');row.className='tier-row';
    const lbl=document.createElement('div');lbl.className='tier-label';lbl.style.background=MODES[currentMode].colors[i];lbl.textContent=t;
    const drop=document.createElement('div');drop.className='tier-drop';drop.dataset.tier=t;
    (state[currentGame].tiers[currentMode][t]||[]).forEach(c=>drop.appendChild(makeCard(c,'tier',t)));
    setupDrop(drop);row.appendChild(lbl);row.appendChild(drop);con.appendChild(row);
  });
}
function makeCard(char,from,tier){
  const card=document.createElement('div');card.className='char-card';card.draggable=true;
  card.dataset.id=char.id;card.dataset.from=from;if(tier)card.dataset.tier=tier;
  if(char.img){const img=document.createElement('img');img.src=char.img;card.appendChild(img);}
  else{const ph=document.createElement('div');ph.className='char-ph';ph.textContent=char.emoji||'?';card.appendChild(ph);}
  const nm=document.createElement('div');nm.className='char-name';nm.textContent=char.name;card.appendChild(nm);
  card.addEventListener('dragstart',onDragStart);card.addEventListener('dragend',onDragEnd);
  card.addEventListener('click',e=>{e.stopPropagation();showCtxMenu(card,char,from,tier);});
  return card;
}

/* ── CTX & DRAG ── */
function showCtxMenu(card,char,from,tier){
  if(activeCard)activeCard.classList.remove('selected');activeCard=card;card.classList.add('selected');
  const menu=document.getElementById('ctxMenu'),mode=MODES[currentMode];let html='';
  if(from==='tier'){
    mode.tiers.forEach((t,i)=>{if(t!==tier)html+=`<div class="ctx-item" onclick="moveToTier('${char.id}','${tier}','${t}','tier')"><span class="ctx-dot" style="background:${mode.colors[i]}"></span>${t}</div>`;});
    html+=`<div class="ctx-divider"></div><div class="ctx-item ctx-back" onclick="moveToPool('${char.id}','${tier}')">← 移回待排</div>`;
  }else{mode.tiers.forEach((t,i)=>{html+=`<div class="ctx-item" onclick="moveToTier('${char.id}',null,'${t}','pool')"><span class="ctx-dot" style="background:${mode.colors[i]}"></span>${t}</div>`;});}
  menu.innerHTML=html;
  const rect=card.getBoundingClientRect();let left=rect.left,top=rect.bottom+4;
  if(left+120>window.innerWidth)left=window.innerWidth-128;
  menu.style.left=left+'px';menu.style.top=top+'px';menu.classList.add('show');
}
function moveToTier(id,fromTier,toTier,from){
  const char=findChar(id);if(!char)return;
  if(from==='pool')state[currentGame].pool=state[currentGame].pool.filter(c=>c.id!==id);
  else state[currentGame].tiers[currentMode][fromTier]=state[currentGame].tiers[currentMode][fromTier].filter(c=>c.id!==id);
  state[currentGame].tiers[currentMode][toTier].push(char);closeCtx();renderPool();renderTiers();
}
function moveToPool(id,fromTier){
  const char=findChar(id);if(!char)return;
  state[currentGame].tiers[currentMode][fromTier]=state[currentGame].tiers[currentMode][fromTier].filter(c=>c.id!==id);
  state[currentGame].pool.push(char);closeCtx();renderPool();renderTiers();
}
function closeCtx(){document.getElementById('ctxMenu').classList.remove('show');if(activeCard){activeCard.classList.remove('selected');activeCard=null;}}
document.addEventListener('click',e=>{
  closeCtx();
  const sp=document.getElementById('sharePopup');
  if(sp&&!sp.contains(e.target)&&!e.target.classList.contains('btn-share-tool'))sp.classList.remove('show');
});
function setupDrop(el){
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over');});
  el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
  el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drag-over');onDrop(el);});
}
function onDragStart(e){dragCard=e.currentTarget;dragFrom=dragCard.dataset.from;dragTier=dragCard.dataset.tier;setTimeout(()=>dragCard.classList.add('dragging'),0);}
function onDragEnd(){if(dragCard){dragCard.classList.remove('dragging');dragCard=null;dragFrom=null;dragTier=null;}}
function onDrop(dz){
  if(!dragCard)return;const cid=dragCard.dataset.id,toTier=dz.dataset.tier;const char=findChar(cid);if(!char)return;
  if(dragFrom==='pool')state[currentGame].pool=state[currentGame].pool.filter(c=>c.id!==cid);
  else if(dragFrom==='tier')state[currentGame].tiers[currentMode][dragTier]=state[currentGame].tiers[currentMode][dragTier].filter(c=>c.id!==cid);
  state[currentGame].tiers[currentMode][toTier].push(char);renderPool();renderTiers();
}
function findChar(id){
  if(!currentGame)return null;const p=state[currentGame].pool.find(c=>c.id===id);if(p)return p;
  for(const m of Object.keys(MODES))for(const t of MODES[m].tiers){const f=(state[currentGame].tiers[m][t]||[]).find(c=>c.id===id);if(f)return f;}
  return null;
}

/* ── SNAP / SHARE ── */
function showSnap(){
  const mode=MODES[currentMode];
  document.getElementById('snapTitle').textContent=(currentGame||'—')+' · '+currentMode;
  document.getElementById('snapQR').src=CONFIG.QR_IMAGE;
  document.getElementById('snapTiers').innerHTML=!currentGame?
    '<div style="color:var(--text3);padding:24px;text-align:center;">請先選擇遊戲</div>':
    mode.tiers.map((t,i)=>{const chars=state[currentGame].tiers[currentMode][t]||[];
      return`<div class="snap-tier-row"><div class="snap-tier-label" style="background:${mode.colors[i]}">${t}</div><div class="snap-tier-chars">${chars.map(c=>`<div class="snap-char">${c.img?`<img src="${c.img}">`:`<div class="snap-char-ph">${c.emoji||'?'}</div>`}<div class="snap-char-name">${c.name}</div></div>`).join('')}${!chars.length?'<div class="snap-empty">—</div>':''}</div></div>`;
    }).join('');
  document.getElementById('editView').classList.add('hide');document.getElementById('snapView').classList.add('show');window.scrollTo(0,0);
}
function hideSnap(){document.getElementById('snapView').classList.remove('show');document.getElementById('editView').classList.remove('hide');}
function showSharePopup(){
  document.getElementById('sharePopupText').textContent=`我發現了個超實用的「${currentMode}」角色排行工具：${CONFIG.SITE_URL}\n你也來試試吧✨`;
  document.getElementById('sharePopup').classList.add('show');
}
function closeSharePopup(){document.getElementById('sharePopup').classList.remove('show');}
function copyShareText(){
  const text=document.getElementById('sharePopupText').textContent;
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>showToast('文案已複製！'));}
  else{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('文案已複製！');}
  closeSharePopup();
}

/* ── UTILS ── */
function showToast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.style.background=err?'#c0392b':'var(--gold)';t.style.display='block';setTimeout(()=>t.style.display='none',2400);}
function showLoading(v){document.getElementById('loadingBar').classList.toggle('show',v);}
function setSyncStatus(msg,ok){const el=document.getElementById('syncStatus');if(!el)return;el.textContent=msg;el.className='sync-status '+(ok?'ok':'err');}
function fmt8(iso){
  const d=new Date(iso);
  const u8=new Date(d.getTime()+8*3600000);
  return u8.toISOString().replace('T',' ').slice(0,16);
}
function todayStr(){const d=new Date(Date.now()+8*3600000);return d.toISOString().slice(0,10);}
function daysAgoStr(n){const d=new Date(Date.now()+8*3600000-n*86400000);return d.toISOString().slice(0,10);}

async function writeLog(action,detail){if(!sb||!adminNick)return;try{await sb.from('admin_logs').insert({nickname:adminNick,action,detail});}catch(_){}}

/* ── 批量上傳 ── */
let batchQueue=[];
function batchPreview(){
  const files=Array.from(document.getElementById('batchImgs').files);
  batchQueue=[];const preview=document.getElementById('batchPreview');preview.innerHTML='';
  if(!files.length){document.getElementById('batchConfirmBtn').style.display='none';return;}
  let done=0;const check=()=>{if(done===files.length&&batchQueue.length)document.getElementById('batchConfirmBtn').style.display='block';};
  files.forEach((file,i)=>{
    if(file.size>5*1024*1024){showToast(`${file.name} 超過5MB，已略過`,true);done++;check();return;}
    const reader=new FileReader();
    reader.onload=e=>{
      const canvas=document.createElement('canvas');canvas.width=80;canvas.height=80;
      const c2d=canvas.getContext('2d');const img=new Image();
      img.onload=()=>{
        const s=Math.min(img.width,img.height),ox=(img.width-s)/2,oy=(img.height-s)/2;
        c2d.drawImage(img,ox,oy,s,s,0,0,80,80);
        const dataUrl=canvas.toDataURL('image/jpeg',.85);
        const baseName=file.name.replace(/\.[^.]+$/,'');
        const idx=batchQueue.length;
        batchQueue.push({id:'u'+Date.now()+'_'+i,name:baseName,img:dataUrl,blob:null});
        canvas.toBlob(blob=>{batchQueue[idx].blob=blob;},'image/jpeg',.85);
        const item=document.createElement('div');item.className='batch-item';
        item.innerHTML=`<img src="${dataUrl}"><input type="text" value="${baseName}" oninput="batchQueue[${idx}].name=this.value"/>`;
        preview.appendChild(item);done++;check();
      };img.src=e.target.result;
    };reader.readAsDataURL(file);
  });
}
async function batchUpload(){
  const game=document.getElementById('newCharGame').value;
  if(!game){showToast('請先選擇所屬遊戲',true);return;}
  if(!state[game])initState(game);
  showLoading(true);let ok=0;
  for(let i=0;i<batchQueue.length;i++){
    const c=batchQueue[i];
    if(sb){
      try{
        const blob=c.blob||await new Promise(res=>{const cv=document.createElement('canvas');cv.width=80;cv.height=80;const ctx=cv.getContext('2d');const im=new Image();im.onload=()=>{const s=Math.min(im.width,im.height),ox=(im.width-s)/2,oy=(im.height-s)/2;ctx.drawImage(im,ox,oy,s,s,0,0,80,80);cv.toBlob(b=>res(b),'image/jpeg',.85);};im.src=c.img;});
        const{error:upErr}=await sb.storage.from('character-images').upload(`${c.id}.jpg`,blob,{contentType:'image/jpeg',upsert:true});
        if(upErr)throw upErr;
        const{data:{publicUrl}}=sb.storage.from('character-images').getPublicUrl(`${c.id}.jpg`);
        const{error:dbErr}=await sb.from('characters').insert({id:c.id,name:c.name,game,img_url:publicUrl,sort_order:i});
        if(dbErr)throw dbErr;
        c.img=publicUrl;ok++;
      }catch(e){showToast(`${c.name} 上傳失敗`,true);console.error(e);continue;}
    }else ok++;
    const nc={id:c.id,name:c.name,img:c.img};
    state[game].pool.push(nc);originalOrder[game]=[...(originalOrder[game]||[]),nc];
  }
  if(ok>0)writeLog('新增角色',`批量新增 ${ok} 個角色至「${game}」`);
  batchQueue=[];document.getElementById('batchPreview').innerHTML='';
  document.getElementById('batchConfirmBtn').style.display='none';document.getElementById('batchImgs').value='';
  if(currentGame===game){renderPool();renderTiers();}
  renderCharManageGrid();showLoading(false);showToast(`成功上傳 ${ok} 個角色！`);
}

/* ── 角色管理 ── */
function renderCharManageGrid(){
  const grid=document.getElementById('charManageGrid');if(!grid)return;
  const g=document.getElementById('newCharGame')?.value||games[0];
  if(!g){grid.innerHTML='<div style="color:var(--text3);font-size:12px;">請先選擇遊戲</div>';return;}
  const all=getAllChars(g);
  if(!all.length){grid.innerHTML='<div style="color:var(--text3);font-size:12px;padding:8px;">此遊戲尚無角色</div>';return;}
  grid.innerHTML=all.map(c=>`<div class="char-manage">
    <div class="char-card" style="width:100%;cursor:default;">${c.img?`<img src="${c.img}" style="width:100%;height:72px;object-fit:cover;display:block;">`:`<div class="char-ph">${c.emoji||'?'}</div>`}<div class="char-name">${c.name}</div></div>
    <button class="del" onclick="deleteChar('${c.id}','${g}')">✕</button>
  </div>`).join('');
}
async function deleteChar(id,g){
  if(!confirm('確定刪除此角色嗎？'))return;
  const char=getAllChars(g).find(c=>c.id===id);
  if(sb){try{await sb.from('characters').delete().eq('id',id);}catch(_){}try{await sb.storage.from('character-images').remove([`${id}.jpg`]);}catch(_){}}
  state[g].pool=state[g].pool.filter(c=>c.id!==id);
  Object.keys(MODES).forEach(m=>MODES[m].tiers.forEach(t=>{state[g].tiers[m][t]=(state[g].tiers[m][t]||[]).filter(c=>c.id!==id);}));
  originalOrder[g]=(originalOrder[g]||[]).filter(c=>c.id!==id);
  if(currentGame===g){renderPool();renderTiers();}
  renderCharManageGrid();writeLog('刪除角色',`從「${g}」刪除「${char?.name||id}」`);
}

/* ── 遊戲頁籤管理 ── */
function renderAdminGameTags(){
  document.getElementById('gameTagList').innerHTML=games.map(g=>
    `<div class="tag">${g}<span class="del-tag" onclick="event.stopPropagation();deleteGame('${g}')">✕</span></div>`
  ).join('');
}
async function addGame(){
  const n=document.getElementById('newGameName').value.trim();if(!n||games.includes(n))return;
  if(sb){const{error}=await sb.from('games').insert({name:n});if(error){showToast('新增失敗',true);return;}}
  games.push(n);initState(n);renderTabs();renderAdminGameTags();
  document.getElementById('newCharGame').innerHTML=games.map(g=>`<option>${g}</option>`).join('');
  document.getElementById('newGameName').value='';
  writeLog('新增頁籤',`新增遊戲「${n}」`);showToast(`已新增「${n}」！`);
}
async function deleteGame(g){
  if(games.length<=1){showToast('至少保留一個遊戲',true);return;}
  if(!confirm(`確定刪除「${g}」及其所有角色嗎？`))return;
  if(sb){try{await sb.from('characters').delete().eq('game',g);}catch(_){}try{await sb.from('games').delete().eq('name',g);}catch(_){}}
  games=games.filter(x=>x!==g);
  if(currentGame===g){currentGame=null;document.getElementById('noGameHint').style.display='block';document.getElementById('poolAndTiers').style.display='none';updateLogo();}
  renderTabs();renderAdminGameTags();
  document.getElementById('newCharGame').innerHTML=games.map(g=>`<option>${g}</option>`).join('');
  writeLog('刪除頁籤',`刪除遊戲「${g}」`);
}

/* ── 數據 ── */
function openStatsTab(){switchAdminTab('stats');}
function setStatRange(r){
  ['today','7','30'].forEach(k=>document.getElementById('statBtn_'+k)?.classList.toggle('active',k===r));
  const today=todayStr();
  if(r==='today'){document.getElementById('statFrom').value=today;document.getElementById('statTo').value=today;}
  else if(r==='7'){document.getElementById('statFrom').value=daysAgoStr(6);document.getElementById('statTo').value=today;}
  else if(r==='30'){document.getElementById('statFrom').value=daysAgoStr(29);document.getElementById('statTo').value=today;}
  loadStats();
}
async function loadStats(){
  if(!sb){document.getElementById('statPV').textContent='—';document.getElementById('statUV').textContent='—';return;}
  const from=document.getElementById('statFrom').value;
  const to=document.getElementById('statTo').value;
  if(!from||!to)return;
  const fromUTC=new Date(from+'T00:00:00+08:00').toISOString();
  const toUTC=new Date(to+'T23:59:59+08:00').toISOString();
  try{
    const{data,error}=await sb.from('page_views').select('visitor_id,created_at').gte('created_at',fromUTC).lte('created_at',toUTC);
    if(error)throw error;
    document.getElementById('statPV').textContent=data.length;
    document.getElementById('statUV').textContent=new Set(data.map(r=>r.visitor_id)).size;
    drawChart(data,from,to);
  }catch(e){document.getElementById('statPV').textContent='錯誤';document.getElementById('statUV').textContent='錯誤';}
}

function drawChart(data,from,to){
  /* 產生日期範圍 */
  const days=[];let d=new Date(from+'T00:00:00+08:00');const end=new Date(to+'T23:59:59+08:00');
  while(d<=end){days.push(d.toISOString().slice(0,10));d=new Date(d.getTime()+86400000);}
  /* 按日統計 */
  const pvMap={},uvMap={};
  days.forEach(day=>{pvMap[day]=0;uvMap[day]=new Set();});
  data.forEach(r=>{
    const day=new Date(new Date(r.created_at).getTime()+8*3600000).toISOString().slice(0,10);
    if(pvMap[day]!==undefined){pvMap[day]++;uvMap[day].add(r.visitor_id);}
  });
  const pvVals=days.map(d=>pvMap[d]);
  const uvVals=days.map(d=>uvMap[d].size);
  const labels=days.map(d=>d.slice(5));/* MM-DD */

  const canvas=document.getElementById('pvChart');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');

  /* 手動繪製折線圖 */
  const W=canvas.offsetWidth||320,H=160;
  canvas.width=W;canvas.height=H;
  ctx.clearRect(0,0,W,H);

  const pad={top:16,right:16,bottom:28,left:32};
  const cw=W-pad.left-pad.right,ch=H-pad.top-pad.bottom;
  const maxVal=Math.max(...pvVals,...uvVals,1);
  const n=days.length;

  function xPos(i){return pad.left+(i/(Math.max(n-1,1)))*cw;}
  function yPos(v){return pad.top+ch-(v/maxVal)*ch;}

  /* 格線 */
  ctx.strokeStyle='rgba(42,58,80,.6)';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=pad.top+(i/4)*ch;
    ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(pad.left+cw,y);ctx.stroke();
    ctx.fillStyle='rgba(80,96,112,.8)';ctx.font='10px sans-serif';ctx.textAlign='right';
    ctx.fillText(Math.round(maxVal*(1-i/4)),pad.left-4,y+4);
  }

  /* X 軸標籤 */
  ctx.fillStyle='rgba(80,96,112,.8)';ctx.font='10px sans-serif';ctx.textAlign='center';
  const step=Math.max(1,Math.ceil(n/6));
  days.forEach((day,i)=>{if(i%step===0||i===n-1)ctx.fillText(labels[i],xPos(i),H-6);});

  function drawLine(vals,color){
    ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineJoin='round';
    vals.forEach((v,i)=>{i===0?ctx.moveTo(xPos(i),yPos(v)):ctx.lineTo(xPos(i),yPos(v));});
    ctx.stroke();
    vals.forEach((v,i)=>{ctx.beginPath();ctx.fillStyle=color;ctx.arc(xPos(i),yPos(v),3,0,Math.PI*2);ctx.fill();});
  }

  drawLine(pvVals,'#c8a84b');
  drawLine(uvVals,'#4a9eff');

  /* 圖例 */
  ctx.font='11px sans-serif';ctx.textAlign='left';
  ctx.fillStyle='#c8a84b';ctx.fillRect(pad.left,4,12,3);ctx.fillText('PV',pad.left+16,10);
  ctx.fillStyle='#4a9eff';ctx.fillRect(pad.left+50,4,12,3);ctx.fillText('UV',pad.left+66,10);
}

/* ── Log ── */
function clearLogFilter(){document.getElementById('logFrom').value='';document.getElementById('logTo').value='';loadLogs(1);}
async function loadLogs(page){
  logPage=page;if(!sb){document.getElementById('logBody').innerHTML='<tr><td colspan="4" style="color:var(--text3);padding:12px;text-align:center;">Supabase 未連線</td></tr>';return;}
  const from=document.getElementById('logFrom').value;const to=document.getElementById('logTo').value;
  const offset=(page-1)*LOG_PER_PAGE;
  try{
    let q=sb.from('admin_logs').select('*',{count:'exact'}).order('created_at',{ascending:false}).range(offset,offset+LOG_PER_PAGE-1);
    if(from)q=q.gte('created_at',new Date(from+'T00:00:00+08:00').toISOString());
    if(to)q=q.lte('created_at',new Date(to+'T23:59:59+08:00').toISOString());
    const{data,count,error}=await q;if(error)throw error;
    logTotal=count||0;
    const tbody=document.getElementById('logBody');
    tbody.innerHTML=!data.length?'<tr><td colspan="4" style="color:var(--text3);padding:12px;text-align:center;">無記錄</td></tr>':
      data.map(r=>`<tr><td>${fmt8(r.created_at)}</td><td>${r.nickname}</td><td><span class="log-tag ${r.action.includes('新增')?'add':'del'}">${r.action}</span></td><td>${r.detail||''}</td></tr>`).join('');
    const tp=Math.max(1,Math.ceil(logTotal/LOG_PER_PAGE));
    document.getElementById('logPageInfo').textContent=`第 ${page} / ${tp} 頁（共 ${logTotal} 筆）`;
    document.getElementById('logPrev').disabled=page<=1;document.getElementById('logNext').disabled=page>=tp;
  }catch(e){document.getElementById('logBody').innerHTML='<tr><td colspan="4" style="color:var(--red);">載入失敗</td></tr>';}
}
